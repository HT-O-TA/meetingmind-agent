[pytest]
testpaths = tests/agent tests/api tests/chunking
asyncio_mode = auto
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = --tb=short

; ============================================
; 当前项目 pytest 配置与测试覆盖分析
; ============================================
;
; 📋 全局 fixtures (tests/conftest.py):
;   - mock_llm_service: 模拟 LLM 服务
;   - mock_vector_search_service: 模拟向量搜索服务
;   - test_data_dir: 测试数据目录
;
; ✅ 已有测试覆盖的功能:
;   ├── tests/agent/ (Agent 系统测试)
;   │   ├── test_agent_behavior.py: Agent 节点行为
;   │   ├── test_agent_workflow.py: Agent 完整流程
;   │   ├── test_meeting_tools.py: 会议工具
;   │   ├── test_tool_manager.py: 工具管理
;   │   ├── test_tool_executor.py: 工具执行器
;   │   └── test_workflow_router.py: 工作流路由
;   ├── tests/chunking/ (文档分块测试)
;   │   ├── test_document_chunking.py: 文档切分
;   │   └── test_semantic_chunker.py: 语义分块
;   └── tests/api/ (API 接口测试)
;       └── test_endpoints.py: API 端点测试
;
; ❌ 缺少测试覆盖的功能:
;   ├── 文档服务 (document_service.py)
;   ├── 会议服务 (meeting_service.py)
;   ├── 待办服务 (todo_service.py)
;   ├── 用户服务 (user_service.py)
;   ├── 向量搜索 (vector_search_service.py)
;   ├── 向量化服务 (embedding_service.py)
;   ├── RAG 服务 (rag_service.py)
;   ├── 增强检索融合 (enhanced_retrieval_fusion.py)
;   ├── 知识图谱 (knowledge_graph.py)
;   ├── 任务队列 (task_queue.py)
;   └── RabbitMQ Worker (document_worker.py)
;
; 📊 测试覆盖估算: 约 30-40%
;
; ============================================
