# 默认启动可复现轻量核心：Web、Worker、前端、PostgreSQL、Redis、RabbitMQ。
# Neo4j 与观测组件使用 profile；模型/ASR 服务独立于 Web 镜像。

x-backend-environment: &backend-environment
  APP_NAME: MeetingMind
  APP_ENV: ${APP_ENV:-development}
  DEBUG: "false"
  SECRET_KEY: ${SECRET_KEY:-meetingmind-dev-only-secret-change-before-production}
  DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/meetingmind
  CORS_ORIGINS: ${CORS_ORIGINS:-["http://localhost:8080","http://localhost:5173"]}
  REDIS_URL: redis://redis:6379/0
  RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
  QUEUE_PREFETCH_COUNT: ${QUEUE_PREFETCH_COUNT:-1}
  QUEUE_MAX_RETRIES: ${QUEUE_MAX_RETRIES:-2}
  QUEUE_RETRY_DELAY_SECONDS: ${QUEUE_RETRY_DELAY_SECONDS:-5}
  LLM_API_BASE: ${LLM_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
  LLM_API_KEY: ${LLM_API_KEY:-}
  LLM_MODEL: ${LLM_MODEL:-qwen3.6-plus}
  EMBEDDING_DEVICE: cpu
  USE_GPU: "false"
  ENABLE_AGENT_WORKER: "false"
  ENABLE_KNOWLEDGE_GRAPH: "false"
  ENABLE_NEO4J_PERSISTENCE: "false"
  ENABLE_ASR: "false"
  ENABLE_MULTIMODAL: "false"
  ENABLE_MCP_SERVER: "false"
  JIRA_MCP_ENABLED: ${JIRA_MCP_ENABLED:-false}
  JIRA_MCP_URL: ${JIRA_MCP_URL:-}
  JIRA_MCP_USERNAME: ${JIRA_MCP_USERNAME:-}
  JIRA_MCP_API_TOKEN: ${JIRA_MCP_API_TOKEN:-}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}

services:
  postgres:
    image: postgres:16-alpine
    container_name: meetingmind-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: meetingmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d meetingmind"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [meetingmind-network]

  redis:
    image: redis:7-alpine
    container_name: meetingmind-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [meetingmind-network]

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: meetingmind-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    ports:
      - "127.0.0.1:${RABBITMQ_PORT:-5672}:5672"
      - "127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:-15672}:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s
    networks: [meetingmind-network]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: meetingmind-backend:local
    container_name: meetingmind-backend
    restart: unless-stopped
    environment: *backend-environment
    volumes:
      - backend_uploads:/app/uploads
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks: [meetingmind-network]

  worker:
    image: meetingmind-backend:local
    container_name: meetingmind-worker
    restart: unless-stopped
    command: ["python", "-m", "app.workers.run"]
    environment: *backend-environment
    volumes:
      - backend_uploads:/app/uploads
    depends_on:
      backend:
        condition: service_healthy
    # 共享 Web 镜像但不监听 HTTP；避免继承 Dockerfile 的 /health 检查而误报。
    healthcheck:
      disable: true
    networks: [meetingmind-network]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: meetingmind-frontend:local
    container_name: meetingmind-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks: [meetingmind-network]

  neo4j:
    profiles: ["knowledge-graph"]
    image: neo4j:5.15.0
    container_name: meetingmind-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
    volumes:
      - neo4j_data:/data
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:7474"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks: [meetingmind-network]

  prometheus:
    profiles: ["observability"]
    image: prom/prometheus:v2.51.0
    container_name: meetingmind-prometheus
    restart: unless-stopped
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      backend:
        condition: service_healthy
    networks: [meetingmind-network]

  grafana:
    profiles: ["observability"]
    image: grafana/grafana:10.4.0
    container_name: meetingmind-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-3000}:3000"
    depends_on: [prometheus]
    networks: [meetingmind-network]

networks:
  meetingmind-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  backend_uploads:
  neo4j_data:
  prometheus_data:
  grafana_data:
