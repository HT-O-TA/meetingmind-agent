# ============================================
# MeetingMind Docker Compose 配置
# 包含：后端(backend)、前端(frontend)、PostgreSQL、Redis、Neo4j
# ============================================

services:
  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: meetingmind-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: meetingmind
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - meetingmind-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: meetingmind-redis
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - meetingmind-network

  # RabbitMQ 消息队列
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: meetingmind-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-admin}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-admin123}
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
      - rabbitmq_logs:/var/log/rabbitmq
    ports:
      - "5672:5672"   # AMQP协议端口
      - "15672:15672" # Management UI端口
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - meetingmind-network

  # Neo4j 知识图谱
  neo4j:
    image: neo4j:5.15.0
    container_name: meetingmind-neo4j
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-password}
      NEO4J_apoc_export_file_enabled: "true"
      NEO4J_apoc_import_file_enabled: "true"
      NEO4J_apoc_import_file_use__neo4j__config: "true"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - neo4j_plugins:/plugins
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - meetingmind-network

  # 后端服务
  backend:
    image: meetingmind-backend:local
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        HTTP_PROXY: ""
        HTTPS_PROXY: ""
        http_proxy: ""
        https_proxy: ""
        NO_PROXY: "*"
        no_proxy: "*"
    container_name: meetingmind-backend
    environment:
      # 应用配置
      APP_NAME: MeetingMind
      APP_ENV: ${APP_ENV:-development}
      DEBUG: ${DEBUG:-true}
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-in-production}
      
      # 数据库配置
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/meetingmind
      
      # CORS配置
      CORS_ORIGINS: '["http://localhost:5173","http://localhost:8080","http://localhost:3000"]'
      
      # Redis配置
      REDIS_URL: redis://redis:6379/0
      
      # RabbitMQ配置
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      
      # Neo4j配置
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USERNAME: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-password}
      
      # LLM配置（使用环境变量或外部服务）
      LLM_API_BASE: ${LLM_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY: ${LLM_API_KEY:-your-api-key-here}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6-plus}
      
      # 向量化配置
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      
      # 其他配置
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_model:/app/model
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - meetingmind-network

  # 独立异步 Worker：Web 进程只发布任务，Worker 负责 manual ack/retry/DLQ
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: meetingmind-backend:local
    container_name: meetingmind-worker
    command: ["python", "-m", "app.workers.run"]
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:-your-secret-key-here-change-in-production}
      DATABASE_URL: postgresql+asyncpg://postgres:${POSTGRES_PASSWORD:-password}@postgres:5432/meetingmind
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:-admin}:${RABBITMQ_PASSWORD:-admin123}@rabbitmq:5672
      LLM_API_BASE: ${LLM_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3.6-plus}
      EMBEDDING_DEVICE: ${EMBEDDING_DEVICE:-cpu}
      ENABLE_AGENT_WORKER: ${ENABLE_AGENT_WORKER:-false}
      ENABLE_KNOWLEDGE_GRAPH: ${ENABLE_KNOWLEDGE_GRAPH:-false}
      ENABLE_NEO4J_PERSISTENCE: ${ENABLE_NEO4J_PERSISTENCE:-false}
    volumes:
      - ./backend:/app
      - backend_uploads:/app/uploads
      - backend_model:/app/model
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - meetingmind-network

  # Prometheus 监控
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: meetingmind-prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=15d'
    ports:
      - "9090:9090"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - meetingmind-network

  # Grafana 看板
  grafana:
    image: grafana/grafana:10.4.0
    container_name: meetingmind-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
    networks:
      - meetingmind-network

  # 前端服务
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: meetingmind-frontend
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:80 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - meetingmind-network

# 网络配置
networks:
  meetingmind-network:
    driver: bridge

# 数据卷配置
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local
  rabbitmq_logs:
    driver: local
  neo4j_data:
    driver: local
  neo4j_logs:
    driver: local
  neo4j_plugins:
    driver: local
  backend_uploads:
    driver: local
  backend_model:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
