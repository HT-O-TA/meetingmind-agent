# 生产参考覆盖层：仍需外部 TLS、备份、Redis/RabbitMQ 认证轮换与高可用验收。
# 使用前：python3 scripts/preflight_deploy.py --mode production

services:
  rabbitmq:
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?production RABBITMQ_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?production RABBITMQ_PASSWORD is required}

  backend:
    environment:
      APP_ENV: production
      MEETINGMIND_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?production SECRET_KEY is required}
      DATABASE_URL: ${DATABASE_URL:?production DATABASE_URL is required}
      CORS_ORIGINS: ${CORS_ORIGINS:?production CORS_ORIGINS is required}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?production RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?production RABBITMQ_PASSWORD is required}@rabbitmq:5672
      LLM_API_BASE: ${LLM_API_BASE:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-qwen3.7-flash}
      MODEL_TURBO_NAME: ${LLM_MODEL:-qwen3.7-flash}
      MODEL_PLUS_NAME: ${LLM_MODEL:-qwen3.7-flash}
      MODEL_MAX_NAME: ${LLM_MODEL:-qwen3.7-flash}
      QUALITY_GATE_MODEL: ${LLM_MODEL:-qwen3.7-flash}
      ENABLE_RERANK: "false"
      MEMORY_INDEX_WORKER_ENABLED: "false"
      ENABLE_ASR: "false"
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "2"]

  worker:
    environment:
      APP_ENV: production
      MEETINGMIND_DEBUG: "false"
      SECRET_KEY: ${SECRET_KEY:?production SECRET_KEY is required}
      DATABASE_URL: ${DATABASE_URL:?production DATABASE_URL is required}
      REDIS_URL: redis://redis:6379/0
      RABBITMQ_URL: amqp://${RABBITMQ_USER:?production RABBITMQ_USER is required}:${RABBITMQ_PASSWORD:?production RABBITMQ_PASSWORD is required}@rabbitmq:5672
      MEMORY_INDEX_WORKER_ENABLED: "false"
      ENABLE_ASR: "false"
